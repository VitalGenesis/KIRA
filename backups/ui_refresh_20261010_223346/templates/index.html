<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIRA V8</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body>
<main class="shell">
<header class="header"><div><h1>KIRA</h1><div class="muted">Agente local · {{ model }}</div></div><div class="badge">V8 · LOCAL</div></header>
<section class="status"><div>Acceso: <span>{{ workspace }}</span></div><div id="status-text">Cargando...</div><div id="voice-status" aria-live="polite">Modo voz: apagado</div></section>
<section id="approvals" class="approvals"></section>
<section id="chat" class="chat" aria-live="polite"></section>
<form id="form" class="composer"><textarea id="input" rows="2" placeholder="Escribí una orden para KIRA..."></textarea><button type="button" id="mic" title="Dictar un mensaje">🎙 Dictar</button><button type="button" id="voice-mode" aria-pressed="false" title="Activar conversación por voz">Iniciar voz</button><button id="send" type="submit">Enviar</button></form>
</main>
<script src="{{ url_for('static',filename='app.js') }}"></script>
</body></html>
